<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <link rel="stylesheet" href="fontawesome-free-7.0.1-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <div class="nav-container">
        <div class="brand">
            <img src="logo.png"> Spotify
        </div>
        <a href="#">Home</a>
    </div>
</nav>

<div class="container">

    <div class="songList">
        <h1>🎵 My Playlist</h1>

        <div class="songItemContainer">
            <!-- SAME SONG ITEMS (no change needed) -->
        </div>
    </div>

</div>

<div class="bottom">
    <input type="range" id="myProgressBar" min="0" value="0" max="100">

    <div class="icons">
        <i class="fas fa-step-backward" id="previous"></i>
        <i class="far fa-play-circle" id="masterPlay"></i>
        <i class="fas fa-step-forward" id="next"></i>
    </div>

    <div class="songInfo">
        <img src="cover.gif" id="gif">
        <span id="masterSongName">Now Playing...</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
